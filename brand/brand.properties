# Lumen's name, tagline, accent and logo, read by build.sh and tools/make_art.py.
# name: 14 characters at most. accent: #RRGGBB. home_logo: the logo in the home screen's top bar (true/false).
# The images: logo.png (a transparent PNG, one color reads best), icon.png and banner.png, which
# python3 tools/make_art.py draws from the logo (and draws the logo too when there is none).
name=Lumen
tagline=Light by day, dark by night
accent=#0A84FF
home_logo=true
